# Solana dApp Store publishing config.
#
# This is a prepared draft — the real file is generated by the dApp Store CLI
# (`npx dapp-store init`), which adds the publisher/solana address fields it
# manages itself. Keep this as the source of the human-written values and copy
# them across, rather than hand-editing the generated file from scratch.
#
# Docs: https://docs.solanamobile.com/dapp-publishing/prepare

publisher:
  name: Korus
  website: https://korus.fun
  # Required, and shown publicly on the listing.
  email: kingkitty.sol@gmail.com

app:
  name: Korus
  # Must match expo.android.package, or the APK is rejected.
  android_package: fun.korus.app
  url: https://korus.fun
  license_url: https://korus.fun
  copyright_url: https://korus.fun

release:
  # Must match expo.version in app.json.
  version: 1.0.0
  # A NEW keystore, used only for the dApp Store. An APK signed with an
  # existing Google Play key is rejected, and losing this key means the
  # listing can never be updated.
  #
  # media paths are relative to this file.
  address: # filled in by the CLI
  catalog:
    en-US:
      name: Korus
      short_description: Social on Solana — post, tip and play.
      long_description: >
        Korus is a social platform built on Solana. Connect a wallet to post,
        reply, like and repost, tip creators directly in SOL, and follow the
        people you care about.

        Tips go peer to peer — straight from you to the author, with nothing
        held in between. Korus never takes custody of your funds and never
        holds your keys; every payment is approved in your own wallet.

        Also included: play Connect Four, Tic-Tac-Toe and Rock Paper Scissors
        against other users, register for project whitelists and raffles, set
        an NFT as your avatar or use a .sol domain as your name, and go premium
        for custom themes and unlimited username changes.

        Built for Solana Mobile, with Mobile Wallet Adapter support.
      new_in_version: First release.
      saga_features: >
        Uses Mobile Wallet Adapter for wallet connection, message signing and
        SOL transfers, so approvals happen in the wallet you already trust.
      images:
        icon: assets/icon.png
        banner: assets/banner.png
        # At least 4 required. Captured on a Seeker at its native 1200x2670,
        # signed in and on the default mint theme so the listing matches
        # korus.fun.
        screenshots:
          - assets/screenshots/01-feed.png
          - assets/screenshots/02-games.png
          - assets/screenshots/03-events.png
          - assets/screenshots/04-premium.png

solana_mobile_dapp_publisher_portal:
  google_store_package: # leave empty unless also shipping on Google Play

# Age rating and category are set in the publishing portal, not here.
